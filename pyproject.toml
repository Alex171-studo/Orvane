[project]
name = "orvane"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4","E7","E9","F","I","B"]
[tool.coverage.run]
branch = true
source = ["src"]
